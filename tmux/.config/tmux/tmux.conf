# ─── How to use ───────────────────────────────────────────
# Pane movement — prefix + h/j/k/l to move between panes
# Pane resizing — prefix + H/J/K/L (repeatable, hold prefix and tap)
# Splits — prefix + s horizontal, prefix + v vertical — both open in the
#   current directory
# Copy mode — prefix + Enter to enter, then full vi motions. v to start
#   selection, y to yank, C-v for block select
# Window switching — prefix + [ / prefix + ]
# The escape-time 0 line is important if you run Neovim inside tmux — without
#   it there's a noticeable lag every time you hit Escape.
# ─── Prefix ───────────────────────────────────────────────
# Keep C-b or swap to C-a (uncomment to use C-a)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ─── Vi mode ──────────────────────────────────────────────
set -g mode-keys vi        # vim keys in copy mode
set -g status-keys vi      # vim keys in command prompt

# ─── Pane navigation (vim hjkl) ───────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane resizing (vim hjkl, repeatable) ─────────────────
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# ─── Window navigation ────────────────────────────────────
bind -r [ previous-window
bind -r ] next-window

# ─── Copy mode (vi style) ─────────────────────────────────
bind Enter copy-mode                        # enter copy mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line
# hjkl scrolling in copy mode
bind -T copy-mode-vi h   send -X cursor-left
bind -T copy-mode-vi j   send -X cursor-down
bind -T copy-mode-vi k   send -X cursor-up
bind -T copy-mode-vi l   send -X cursor-right

# ─── Splits that remember the current path ────────────────
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# ─── Misc quality of life ─────────────────────────────────
set -g escape-time 0          # no delay after Esc (vital for vim inside tmux)
set -g repeat-time 600        # window for -r repeatable binds (ms)
set -sg focus-events on       # pass focus events to apps (vim autoread etc.)
set -g mouse on               # mouse support (scrolling, click to focus pane)

# ─── Status bar styling (Gruvbox) ────────────────────────
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g window-status-style "fg=#a89984"      # Muted/grey for inactive windows
set -g window-status-current-style "fg=#ede8d0,bold"  # Purple for active window
set -g window-status-format "#I"
set -g window-status-current-format "#I"
set -g status-right "#h"

# ─── nvim image plugin ─────────────────────────────────
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

